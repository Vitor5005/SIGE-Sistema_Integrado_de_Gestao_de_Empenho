<main class="sige-detail-page genero-alimenticio-page">
  <app-botao-voltar></app-botao-voltar>

  <div class="sige-detail-layout genero-alimenticio-layout">
    <section class="sige-detail-shell genero-alimenticio-shell">
      <header class="sige-detail-header">
        <div class="sige-detail-heading">
          <h1 class="sige-detail-title">Gênero alimentício</h1>
          <p class="sige-detail-subtitle">Visualização e edição das informações cadastradas.</p>
        </div>
      </header>

      <section class="sige-detail-section sige-detail-section--flat genero-alimenticio-section" aria-labelledby="dados-genero-title">
        <header class="sige-detail-section-header">
          <h2 id="dados-genero-title" class="sige-detail-section-title">Dados cadastrados</h2>
        </header>

        <div class="sige-detail-info-grid genero-form-grid">
          <div class="sige-detail-field genero-campo">
            <label class="sige-detail-label">CATMAT</label>
            <input value="616816" class="genero-valor" [readonly]="!editando" [class.editando]="editando">
          </div>

          <div class="sige-detail-field genero-campo">
            <label class="sige-detail-label">Categoria</label>
            <select class="genero-valor" [disabled]="!editando" [class.editando]="editando">
              <option value="SECO/MERCEARIA">SECO/MERCEARIA</option>
              <option value="BEBIDAS E COMPLEMENTOS">BEBIDAS E COMPLEMENTOS</option>
              <option value="MOLHOS E CONDIMENTOS">MOLHOS E CONDIMENTOS</option>
              <option value="LÁCTEOS E DERIVADOS">LÁCTEOS E DERIVADOS</option>
            </select>
          </div>

          <div class="sige-detail-field genero-campo">
            <label class="sige-detail-label">Marca</label>
            <input class="genero-valor" value="CAFÉ DO BOCALOM" [readonly]="!editando" [class.editando]="editando">
          </div>

          <div class="sige-detail-field genero-campo">
            <label class="sige-detail-label">Unidade de medida</label>
            <select class="genero-valor" [disabled]="!editando" [class.editando]="editando">
              <option value="KG">QUILOGRAMA(KG)</option>
              <option value="MG">MILIGRAMA(MG)</option>
              <option value="L">LITROS(L)</option>
            </select>
          </div>

          <div class="sige-detail-field genero-campo genero-campo--descricao">
            <label class="sige-detail-label">Descrição</label>
            <textarea class="genero-valor genero-descricao" [readonly]="!editando" [class.editando]="editando">Café azul com chapeu, muito bom.</textarea>
          </div>
        </div>

        @if (pode(Recurso.GENERO_ALIMENTICIO, Acao.EDITAR)) {
        <div class="sige-detail-actions genero-actions">
          <button class="sige-button sige-button--primary btn-editar" value="btn-editar" type="button"
            (click)="habilitarEdicao()">{{ editando ? 'Salvar' : 'Editar' }}</button>
        </div>
        }
      </section>
    </section>
  </div>
</main>
