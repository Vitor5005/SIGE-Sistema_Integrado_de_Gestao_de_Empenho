<main class="auth-page">
  <section class="container-login" aria-labelledby="login-title">
    <div class="login-cabecalho">
      <h1 id="login-title">Acessar conta</h1>
    </div>

    <form (ngSubmit)="realizarLogin()">
      <div class="d-flex flex-column gap-2">
        <label for="Usuario">Usuário</label>
        <input
          type="text"
          name="Usuario"
          id="Usuario"
          [(ngModel)]="username"
          autocomplete="username"
          required
        >
      </div>

      <div>
        <div class="d-flex flex-column gap-2 senha-container">
          <label for="senha">Senha</label>
          <div class="campo-senha">
            <input
              [type]="mostrarSenha ? 'text' : 'password'"
              name="senha"
              id="senha"
              [(ngModel)]="password"
              autocomplete="current-password"
              required
            >
            <button
              type="button"
              class="senha-toggle"
              [attr.aria-label]="mostrarSenha ? 'Ocultar senha' : 'Mostrar senha'"
              (click)="toggleSenha()"
            >
              <i
                class="bi"
                [ngClass]="mostrarSenha ? 'bi-eye-slash' : 'bi-eye'"
                aria-hidden="true"
              ></i>
            </button>
          </div>
        </div>

        <a [routerLink]="['/recuperar-senha']">
          <small>Esqueceu a senha?</small>
        </a>
      </div>

      <button type="submit" class="submit">Entrar</button>
    </form>
  </section>
</main>
