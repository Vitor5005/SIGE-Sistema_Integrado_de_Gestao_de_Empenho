<main class="auth-page">
  <section class="login-banner" aria-label="Campus da UFAC">
    <div class="login-banner-texto">
      <strong class="login-banner-sigla">SIGE</strong>
      <span class="login-banner-nome">Sistema Integrado de Gestão de Empenho</span>
      <span class="login-banner-local">Restaurante Universitário • UFAC</span>
    </div>
  </section>

  <section class="container-login" aria-labelledby="login-title">
    <div class="login-cabecalho">
      <img src="imagens/logo_ru.png" alt="Logotipo do Restaurante Universitário" class="login-logo">
      <h1 id="login-title">Acessar conta</h1>
      <p>Informe seus dados para continuar.</p>
    </div>

    <form (ngSubmit)="realizarLogin()">
      <div class="campo">
        <label for="Usuario">Usuário</label>
        <input
          type="text"
          name="Usuario"
          id="Usuario"
          [(ngModel)]="username"
          autocomplete="username"
          required
        >
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <div class="campo-senha">
          <input
            [type]="mostrarSenha ? 'text' : 'password'"
            name="senha"
            id="senha"
            [(ngModel)]="password"
            autocomplete="current-password"
            required
          >
          <button
            type="button"
            class="senha-toggle"
            [attr.aria-label]="mostrarSenha ? 'Ocultar senha' : 'Mostrar senha'"
            (click)="toggleSenha()"
          >
            <i
              class="bi"
              [ngClass]="mostrarSenha ? 'bi-eye-slash' : 'bi-eye'"
              aria-hidden="true"
            ></i>
          </button>
        </div>
        <a class="link-recuperar" [routerLink]="['/recuperar-senha']">Esqueceu a senha?</a>
      </div>

      <button type="submit" class="submit">Entrar</button>
    </form>
  </section>
</main>
