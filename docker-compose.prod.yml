services:
  db:
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Defina DB_NAME}
      MYSQL_USER: ${DB_USER:?Defina DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Defina DB_ROOT_PASSWORD}

  api:
    command: gunicorn sige_api.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    environment:
      DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Defina DJANGO_SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Defina ALLOWED_HOSTS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      CREATE_SUPERUSER: "False"
      SEED_DATA: "False"

  app:
    build:
      context: ./sige-app
      dockerfile: Dockerfile.prod
    ports:
      - "${APP_PORT:-80}:80"
    environment:
      PORT: 80
      API_HOST: api
      API_PORT: 8000
