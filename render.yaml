# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

databases:
  - name: sige-db
    plan: free
    region: virginia
    databaseName: sige
    user: sige
    ipAllowList: []

services:
  - type: web
    name: sige-api
    runtime: docker
    plan: free
    region: virginia
    branch: deploy
    rootDir: sige-api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sige-db
          property: connectionString
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: sige-app
          envVarKey: RENDER_EXTERNAL_URL
      - key: CSRF_TRUSTED_ORIGINS
        fromService:
          type: web
          name: sige-app
          envVarKey: RENDER_EXTERNAL_URL
      - key: CREATE_SUPERUSER
        value: "False"
      - key: SEED_DATA
        value: "False"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: GUNICORN_TIMEOUT
        value: "120"

  - type: web
    name: sige-app
    runtime: static
    branch: deploy
    rootDir: sige-app
    buildCommand: npm ci && npm run build:render
    staticPublishPath: dist/sige-app/browser
    autoDeployTrigger: commit
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: sige-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
