# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

services:
  - type: pserv
    name: sige-mysql
    runtime: image
    plan: starter
    region: virginia
    image:
      url: docker.io/library/mysql:8
    envVars:
      - key: MYSQL_DATABASE
        value: sige
      - key: MYSQL_USER
        value: sige
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
    disk:
      name: sige-mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10

  - type: web
    name: sige-api
    runtime: docker
    plan: starter
    region: virginia
    branch: deploy
    rootDir: sige-api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    envVars:
      - key: DB_NAME
        value: sige
      - key: DB_USER
        value: sige
      - key: DB_PASSWORD
        fromService:
          type: pserv
          name: sige-mysql
          envVarKey: MYSQL_PASSWORD
      - key: DB_HOST
        fromService:
          type: pserv
          name: sige-mysql
          property: host
      - key: DB_PORT
        fromService:
          type: pserv
          name: sige-mysql
          property: port
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        fromService:
          type: web
          name: sige-api
          property: host
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      - key: CSRF_TRUSTED_ORIGINS
        value: ""
      - key: CREATE_SUPERUSER
        value: "False"
      - key: SEED_DATA
        value: "False"
      - key: WEB_CONCURRENCY
        value: "3"
      - key: GUNICORN_TIMEOUT
        value: "120"

  - type: web
    name: sige-app
    runtime: docker
    plan: free
    region: virginia
    branch: deploy
    rootDir: sige-app
    dockerfilePath: ./Dockerfile.prod
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /
    envVars:
      - key: API_HOST
        fromService:
          type: web
          name: sige-api
          property: host
      - key: API_PORT
        fromService:
          type: web
          name: sige-api
          property: port
